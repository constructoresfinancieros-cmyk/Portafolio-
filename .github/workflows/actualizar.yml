name: Actualizar Precios BVC

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 4:00 PM (hora Caracas)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install beautifulsoup4 requests

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar Cambios Automáticos
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-actualización de precios BVC" || exit 0
          git push

name: Actualizar datos BCV y BVC

on:
  schedule:
    # Cada 2 horas, lunes a viernes, 13:00-20:00 UTC
    # (~9:00am a 4:00pm hora de Venezuela)
    - cron: "0 13-20/2 * * 1-5"
  workflow_dispatch: # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Commitear cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Actualizar datos BCV/BVC $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
